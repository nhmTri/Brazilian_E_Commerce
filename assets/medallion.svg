<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 378" width="1000" height="378" role="img" aria-label="Nine CSV files flow through bronze, a data-quality gate that drops rows failing critical rules, then silver, a gold star schema and ten business views. Below, a slowly changing dimension expires the old customer row and inserts the new one.">
  <style>
    :root{color-scheme:light dark}
    .tag{font:600 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8a8880;letter-spacing:.18em}
    .sn{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fff;letter-spacing:.1em}
    .ss{font:400 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fff;fill-opacity:.82}
    .src{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1b2030}
    .sub{font:400 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8a8880}
    .th{font:600 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8a8880;letter-spacing:.14em}
    .td{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1b2030}
    .td.dim{fill:#8a8880}
    .ttl{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1b2030;letter-spacing:.06em}
    .box{fill:none;stroke:#d6dbe6;stroke-width:1.5}
    .tr{fill:#f2f4f8}
    .tr.new{animation:slide .7s cubic-bezier(.3,1.2,.5,1) 1.1s backwards}
    @keyframes slide{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}

    .pk{animation:run 5.5s linear infinite}
    @keyframes run{0%{transform:translateX(0)}100%{transform:translateX(800px)}}
    .pk.bad{animation:drop 5.5s cubic-bezier(.3,0,.3,1) infinite}
    @keyframes drop{
      0%{transform:translateX(0) translateY(0);opacity:.95}
      34%{transform:translateX(188px) translateY(0);opacity:.95}
      46%{transform:translateX(196px) translateY(54px);opacity:1}
      100%{transform:translateX(196px) translateY(54px);opacity:1}
    }
    .gate{fill:none;stroke:#d03b3b;stroke-width:2;stroke-dasharray:3 4;
          animation:slidedash 1.6s linear infinite}
    @keyframes slidedash{to{stroke-dashoffset:-14}}
    .scan{animation:scan 2.6s ease-in-out infinite}
    @keyframes scan{0%,100%{opacity:.12}50%{opacity:.34}}
    .stamp{opacity:0;animation:fade .5s ease-out .8s forwards}
    @keyframes fade{to{opacity:1}}

    @media (prefers-reduced-motion:reduce){
      .pk,.gate,.scan{animation:none}
      .pk.bad{transform:translateX(196px) translateY(54px)}
      .tr.new,.stamp{animation:none;opacity:1}
    }
    @media (prefers-color-scheme:dark){
      .src,.td,.ttl{fill:#e8ecf4} .sub,.tag,.th{fill:#9a9890}
      .td.dim{fill:#7f8aa0} .box{stroke:#2b3443} .tr{fill:#20242c}
    }
  </style>

  <text class="tag" x="32" y="34">MEDALLION ARCHITECTURE &#183; DELTA LAKE &#183; 1.4M ROWS IN, 99,441 FACT ROWS OUT</text>

  <rect class="pk" x="156" y="106" width="15" height="13" rx="3" fill="#3987e5" style="animation-delay:0s"/>
  <rect class="pk" x="156" y="106" width="15" height="13" rx="3" fill="#3987e5" style="animation-delay:-1.1s"/>
  <rect class="pk" x="156" y="106" width="15" height="13" rx="3" fill="#3987e5" style="animation-delay:-2.2s"/>
  <rect class="pk" x="156" y="106" width="15" height="13" rx="3" fill="#3987e5" style="animation-delay:-3.3s"/>
  <rect class="pk" x="156" y="106" width="15" height="13" rx="3" fill="#3987e5" style="animation-delay:-4.4s"/>
  <rect class="pk" x="156" y="106" width="15" height="13" rx="3" fill="#3987e5" style="animation-delay:-5.5s"/>
  <rect class="pk bad" x="156" y="106" width="15" height="13" rx="3" fill="#d03b3b" style="animation-delay:-0.55s"/>
  <rect class="pk bad" x="156" y="106" width="15" height="13" rx="3" fill="#d03b3b" style="animation-delay:-3.85s"/>

  <rect class="box" x="32" y="84" width="118" height="58" rx="8"/>
  <text class="src" x="44" y="108">9 CSV files</text>
  <text class="sub" x="44" y="126">Olist, 1.4M rows</text>

  <rect class="st" x="190" y="84" width="130" height="58" rx="8" fill="#86b6ef"/>
  <rect class="st" x="420" y="84" width="130" height="58" rx="8" fill="#3987e5"/>
  <rect class="st" x="590" y="84" width="172" height="58" rx="8" fill="#184f95"/>
  <rect class="st" x="792" y="84" width="176" height="58" rx="8" fill="#0d366b"/>
  <text class="sn" x="202" y="108">BRONZE</text>
  <text class="ss" x="202" y="126">raw Delta · 9</text>
  <text class="sn" x="432" y="108">SILVER</text>
  <text class="ss" x="432" y="126">cleansed · 8</text>
  <text class="sn" x="602" y="108">GOLD</text>
  <text class="ss" x="602" y="126">star schema · 5 tables</text>
  <text class="sn" x="804" y="108">BUSINESS</text>
  <text class="ss" x="804" y="126">10 analytics views</text>

  <rect class="scan" x="352" y="76" width="42" height="74" rx="7" fill="#d03b3b"/>
  <path class="gate" d="M352 76 h42 v74 h-42 Z"/>
  <text class="tag" x="373" y="68" text-anchor="middle" fill="#d03b3b">DQ GATE</text>


  <text class="sub" x="300" y="186">critical rules drop the row &#183; warn rules log it and let it through</text>

  <line x1="32" y1="222" x2="968" y2="222" stroke="#d6dbe6" stroke-width="1"/>
  <text class="ttl" x="32" y="250">SCD TYPE 2 &#8212; THE OLD ROW IS NEVER OVERWRITTEN</text>

  <text class="th" x="44" y="268">CUSTOMER_KEY</text>
  <text class="th" x="150" y="268">CITY</text>
  <text class="th" x="330" y="268">VALID_FROM</text>
  <text class="th" x="470" y="268">VALID_TO</text>
  <rect class="tr" x="32" y="276" width="640" height="28" rx="5"/>
  <text class="td dim" x="56" y="294">1042</text>
  <text class="td dim" x="150" y="294">São Paulo</text>
  <text class="td dim" x="330" y="294">2024-01-01</text>
  <text class="td dim" x="470" y="294">2025-03-14</text>
  <circle cx="600" cy="289" r="4.5" fill="#d03b3b"/><text class="td" x="612" y="294" fill="#d03b3b">expired</text>
  <rect class="tr new" x="32" y="310" width="640" height="28" rx="5"/>
  <text class="td" x="56" y="328">1042</text>
  <text class="td" x="150" y="328">Rio de Janeiro</text>
  <text class="td" x="330" y="328">2025-03-14</text>
  <text class="td" x="470" y="328">NULL</text>
  <circle cx="600" cy="323" r="4.5" fill="#0ca30c"/><text class="td" x="612" y="328" fill="#0ca30c">current</text>

  <g class="stamp">
    <text class="sub" x="700" y="294">MERGE INTO expires the old version,</text>
    <text class="sub" x="700" y="312">then inserts the new one. Idempotent:</text>
    <text class="sub" x="700" y="330">re-running creates no duplicates.</text>
  </g>
  <text class="sub" x="32" y="368">A customer who moves city keeps their history, so last year&#8217;s revenue still reports against last year&#8217;s region.</text>
</svg>
